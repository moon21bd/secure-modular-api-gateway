  redis:
    image: redis:alpine
    container_name: apigw_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "Nopass1234", "--bind", "127.0.0.1", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app-network

