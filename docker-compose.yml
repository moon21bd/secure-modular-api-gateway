  platform-api-provider-dev:
    image: node:18-alpine
    container_name: platform-api-provider-dev
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - NODE_ENV=development
      - PORT=3001
    ports:
      - "3001:3001"
    command: ["npm", "start"]
    # depends_on:
